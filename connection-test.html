<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WellOne connection test</title><style>body{font-family:system-ui;padding:24px;max-width:720px;margin:auto}pre{white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:12px}.ok{color:#397600}.bad{color:#a21d1d}</style></head><body><h1>WellOne order server test</h1><p id="state">Testing…</p><pre id="out"></pre><script>const key='sb_publishable_RbnMrDlHfEijBiejcRNPUg_mop2bqgM';(async()=>{const s=document.getElementById('state'),o=document.getElementById('out');try{const r=await fetch('/wellone-db/auth/v1/settings',{headers:{apikey:key},cache:'no-store'});const text=await r.text();const html=/^\s*</.test(text);s.textContent=r.ok&&!html?'Proxy working':'Proxy response is not correct';s.className=r.ok&&!html?'ok':'bad';o.textContent=`HTTP ${r.status}\ncontent-type: ${r.headers.get('content-type')}\n\n${text.slice(0,1200)}`;}catch(e){s.textContent='Connection failed';s.className='bad';o.textContent=String(e&&e.message||e);}})();</script></body></html>
